services:
  alignyard:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4500
      ALIGNYARD_DATA_DIR: /data
    ports:
      - "127.0.0.1:4500:4500"
    volumes:
      - alignyard-data:/data
      - ./dist/runner:/app/dist/runner:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  alignyard-data:
