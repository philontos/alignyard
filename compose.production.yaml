services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - alignyard
    environment:
      ALIGNYARD_DOMAIN: ${ALIGNYARD_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
